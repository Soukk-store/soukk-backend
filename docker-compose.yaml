services:
  backend:
    build: .
    container_name: soukk-backend
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    environment:
      ENV: ${ENV}
      PORT: ${PORT}
      WEB_WORKERS: ${WEB_WORKERS}
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      EMAIL_VERIFY_EXPIRE_MINUTES: ${EMAIL_VERIFY_EXPIRE_MINUTES}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_STARTTLS: ${MAIL_STARTTLS}
      MAIL_SSL_TLS: ${MAIL_SSL_TLS}
      RATE_LIMIT_EMAIL_EXISTS: ${RATE_LIMIT_EMAIL_EXISTS}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER}
      RATE_LIMIT_RESEND: ${RATE_LIMIT_RESEND}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - soukk-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT}/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres-db:
    image: postgres:16
    container_name: soukk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - soukk-network

volumes:
  postgres_data:

networks:
  soukk-network: