services:
  backend:
    # Builds the one image shared by backend and celery (same code, different command).
    build: .
    image: soukk-app:latest
    container_name: soukk-backend
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    # All app settings come from .env (see .env.example).
    env_file: .env
    # Inside the compose network the services are reached by name, not through
    # the localhost ports published below (see DOCKER_* in .env).
    environment:
      DB_HOST: ${DOCKER_DB_HOST}
      DB_PORT: ${DOCKER_DB_PORT}
      REDIS_HOST: ${DOCKER_REDIS_HOST}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soukk-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT}/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres-db:
    image: postgres:16
    container_name: soukk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGPORT: ${DOCKER_DB_PORT}
    ports:
      - "127.0.0.1:${DB_PORT}:${DOCKER_DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - soukk-network

  redis:
    image: redis:8.10.2
    container_name: soukk-redis
    restart: unless-stopped
    command: ["redis-server", "--port", "${DOCKER_REDIS_PORT}", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:${DOCKER_REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${DOCKER_REDIS_PORT}", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - soukk-network

  celery:
    image: soukk-app:latest
    pull_policy: never
    container_name: soukk-celery
    restart: unless-stopped
    command: ["celery", "-A", "soukk_backend.core.celeryApp", "worker", "-Q", "celery", "-I", "soukk_backend.core.tasks.emailTask", "--loglevel=INFO", "--concurrency=${CELERY_WORKER_CONCURRENCY}"]
    environment:
      REDIS_HOST: ${DOCKER_REDIS_HOST}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CELERY_DB: ${REDIS_CELERY_DB}
      EMAIL_VERIFY_EXPIRE_MINUTES: ${EMAIL_VERIFY_EXPIRE_MINUTES}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES}
      MAIL_API_URL: ${MAIL_API_URL}
      MAIL_API_TOKEN: ${MAIL_API_TOKEN}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_TIMEOUT_SECONDS: ${MAIL_TIMEOUT_SECONDS}
      EMAIL_ASSET_URL: ${EMAIL_ASSET_URL}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "celery -A soukk_backend.core.celeryApp inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - soukk-network

  celery-maintenance:
    image: soukk-app:latest
    pull_policy: never
    container_name: soukk-celery-maintenance
    restart: unless-stopped
    command: ["celery", "-A", "soukk_backend.core.celeryApp", "worker", "-Q", "maintenance", "-I", "soukk_backend.core.tasks.maintenanceTask", "--loglevel=INFO", "--concurrency=1"]
    environment:
      REDIS_HOST: ${DOCKER_REDIS_HOST}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CELERY_DB: ${REDIS_CELERY_DB}
      DB_HOST: ${DOCKER_DB_HOST}
      DB_PORT: ${DOCKER_DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      TOKEN_CLEANUP_BATCH_SIZE: ${TOKEN_CLEANUP_BATCH_SIZE}
    depends_on:
      redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      backend:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "celery -A soukk_backend.core.celeryApp inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - soukk-network

  celery-beat:
    image: soukk-app:latest
    pull_policy: never
    container_name: soukk-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "soukk_backend.core.celeryBeat", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      REDIS_HOST: ${DOCKER_REDIS_HOST}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CELERY_DB: ${REDIS_CELERY_DB}
      TOKEN_CLEANUP_SCHEDULE: ${TOKEN_CLEANUP_SCHEDULE}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - soukk-network

volumes:
  postgres_data:
  redis_data:

networks:
  soukk-network:
